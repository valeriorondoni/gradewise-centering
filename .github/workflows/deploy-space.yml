# Redeploys the test site to the Hugging Face Space on every push to main.
#
# One-time setup in the GitHub repository (Settings -> Secrets and variables -> Actions):
#   secret   HF_TOKEN  Hugging Face token with write access to the Space
#   variable HF_SPACE  the Space id, e.g. your-name/gradewise-test
# Until HF_SPACE is set the job is skipped, so pushes never fail because of it.
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.30"
      - name: Upload the site to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: python deploy_space.py
